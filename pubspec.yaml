name: smart_safety_jacket
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.12.1
  firebase_database: ^12.4.6

  # Maps
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

  # Open Google Maps
  url_launcher: ^6.3.2

  # Google Font
  google_fonts: ^6.3.2
  firebase_auth: ^6.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Native splash generator
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_native_splash:
  color: "#78FF7A"

  image: assets/images/logo.png

  android: true
  ios: true
  web: false

  android_12:
    color: "#78FF7A"
    image: assets/images/logo.png

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/images/logo.png"

  adaptive_icon_background: "#78FF7A"
  adaptive_icon_foreground: "assets/images/logo.png"

  min_sdk_android: 21